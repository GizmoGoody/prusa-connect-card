<!doctype html>
<meta charset="utf-8">
<title>Prusa Connect card: decisions and feedback</title>
<style>
  body { margin: 0; padding: 16px; background: #111; color: #ddd; font: 13px Roboto, "Segoe UI", sans-serif; }
  pre { white-space: pre-wrap; }
</style>
<script src="stand-ins.js"></script>
<script src="load.js"></script>
<script src="checks.js"></script>
<div id="cards"></div>
<pre id="report" data-result="running">running</pre>
<script>
  // Each check is named by its line in tests/SPEC.md
  const keyNamed = (el, key) => el.shadowRoot.querySelector(`[data-key="${key}"]`);
  const textOf = (el) => el?.textContent.replace(/\s+/g, " ").trim();
  const FUTURE_PRINTER = "sensor.future_core_one_state";

  runChecks(async () => {
    // The console badge: GizmoGoody's card-badge, with the card's icon, name and version
    check("B-1 badge", consoleLines.some((l) => l.includes("🖨️ Prusa Connect Card") && l.includes("by GizmoGoody")),
      `the GizmoGoody badge (${consoleLines.find((l) => /prusa/i.test(l))})`);
    check("B-1 badge", consoleLines.some((l) => l.includes("https://github.com/GizmoGoody/prusa-connect-card")), "with the repository's link");

    // Feature names: "Prusa" and one word, in sentence case
    const names = customCardFeatures.filter((f) => f.type.startsWith("prusa-")).map((f) => f.name);
    check("N-1 names", names.length === 8 && names.every((n) => /^Prusa [a-z]+$/.test(n)), `sentence case, one word after Prusa (${names.join(", ")})`);

    // Show: Icons by default in every feature that has it
    const hass = makeHass();
    const shows = customCardFeatures.filter((f) => f.type.startsWith("prusa-")).map((f) => [f.type, customElements.get(f.type).editor(hass, FUTURE_PRINTER)])
      .filter(([, form]) => form.schema.some((s) => s.name === "show")).map(([type, form]) => [type, form.data({}).show]);
    check("S-1 show", shows.length >= 5 && shows.every(([, show]) => show === "icons"), `Icons by default (${shows.map((s) => s.join(": ")).join(", ")})`);

    // Full width: the camera's on by default, the history's off
    check("L-2 full width", customElements.get("prusa-cameras").editor(hass, FUTURE_PRINTER).data({}).full_width === true
      && customElements.get("prusa-history").editor(hass, FUTURE_PRINTER).data({}).full_width === false, "the camera across both columns, the history in one");

    // Units: none on fan speeds and the nozzle diameter; positions without mm unless Units is on
    const nozzles = addFeature({ type: "custom:prusa-nozzles", controls: ["nozzle_diameter", "print_fan_speed"] }, {});
    await wait(50);
    check("U-1 units", textOf(keyNamed(nozzles, "tool_1_nozzle_diameter")) === "0.4" && textOf(keyNamed(nozzles, "tool_1_print_fan_speed")) === "4200",
      `no unit on the nozzle and the fan (${textOf(keyNamed(nozzles, "tool_1_nozzle_diameter"))}, ${textOf(keyNamed(nozzles, "tool_1_print_fan_speed"))})`);
    const plain = addFeature({ type: "custom:prusa-movement", controls: ["axis_z"] }, {});
    const units = addFeature({ type: "custom:prusa-movement", controls: ["axis_z"], units: true }, {});
    await wait(50);
    check("U-2 units", textOf(keyNamed(plain, "axis_z")) === "20.2" && textOf(keyNamed(units, "axis_z")) === "20.2 mm",
      `positions in mm only with Units (${textOf(keyNamed(plain, "axis_z"))}, ${textOf(keyNamed(units, "axis_z"))})`);

    // A heater and its target: centered in its cell
    // (the nozzle well under its target, so the target shows)
    const heatingHass = makeHass();
    const nozzleTarget = "number.future_core_one_tool_1_nozzle_target_temperature";
    heatingHass.states[nozzleTarget] = { ...heatingHass.states[nozzleTarget], state: "275" };
    const temps = addFeature({ type: "custom:prusa-temperatures" }, { hass: heatingHass, entityId: FUTURE_PRINTER });
    await wait(50);
    const pair = keyNamed(temps, "tool_1_nozzle_temperature_and_target");
    check("H-4 centered", getComputedStyle(pair).justifyContent === "center", `the icon, reading and target centered (${getComputedStyle(pair).justifyContent})`);
    const middle = (r) => r.left + r.width / 2;
    const shownTarget = [...pair.querySelectorAll(".target > *")].filter((el) => getComputedStyle(el).display !== "none").map((el) => el.getBoundingClientRect());
    const targetMiddle = (Math.min(...shownTarget.map((r) => r.left)) + Math.max(...shownTarget.map((r) => r.right))) / 2;
    const now = pair.querySelector(".now").getBoundingClientRect();
    check("H-4 centered", Math.abs(middle(now) - targetMiddle) <= 4, `the reading and the target centered on each other (${middle(now).toFixed(1)}, ${targetMiddle.toFixed(1)})`);
    const chamber = keyNamed(temps, "chamber_temperature_and_target");
    check("H-1 pair", !!chamber && chamber.querySelector("ha-state-icon")?.stateObj?.entity_id === "sensor.future_core_one_chamber_temperature",
      "the chamber's too, with its sensor's icon");

    // Presets: every nozzle and the bed, never the chamber
    const presetsHass = makeHass();
    temps.hass = presetsHass;
    await wait(50);
    const menu = keyNamed(temps, "presets").querySelector("select");
    menu.value = "PLA";
    menu.dispatchEvent(new Event("change"));
    const set = presetsHass.calls.map((c) => `${c.data.entity_id}=${c.data.value}`);
    check("P-1 presets", set.join() === "number.future_core_one_tool_1_nozzle_target_temperature=215,number.future_core_one_bed_target_temperature=60",
      `PLA sets the nozzle and the bed, not the chamber (${set.join(", ")})`);

    // Cool down: every heater off, the chamber's too
    presetsHass.calls.length = 0;
    keyNamed(temps, "cool_down").click();
    const off = presetsHass.calls.map((c) => `${c.data.entity_id.split(".")[1]}=${c.data.value}`);
    check("P-2 cool down", off.length === 3 && off.every((c) => c.endsWith("=0")) && off.some((c) => c.startsWith("future_core_one_chamber")),
      `every heater to 0 (${off.join(", ")})`);

    // The chamber fan: Off, A and Manual, as Prusa Connect sets it
    const fanKeys = ["off", "auto", "manual"].map((k) => keyNamed(temps, `chamber_fan_${k}`));
    check("F-1 chamber fan", fanKeys.every(Boolean) && fanKeys[2].getAttribute("aria-pressed") === "true" && textOf(fanKeys[2]).includes("60%"),
      `Off, A and Manual, Manual on at 60% (${fanKeys.map((k) => k?.getAttribute("aria-pressed")).join()})`);
    presetsHass.calls.length = 0;
    fanKeys[0].click();
    check("F-1 chamber fan", presetsHass.calls[0]?.service === "turn_off", `Off turns the fan off (${JSON.stringify(presetsHass.calls[0])})`);
    check("F-2 fan turns", fanKeys[2].querySelector(".spin") !== null, "the fan's icon turns while it runs");

    // Crop: the box keeps its shape through new pictures and updates
    const cropping = addFeature({ type: "custom:prusa-cameras", controls: ["crop"] }, {});
    await wait(200);
    keyNamed(cropping, "crop").click();
    await wait(50);
    const shot = cropping.shadowRoot.querySelector(".shot");
    const view = () => cropping.shadowRoot.querySelector(".view");
    const box = view().getBoundingClientRect();
    const tapAt = (u, v) => shot.dispatchEvent(new MouseEvent("click", { clientX: box.left + u * box.width, clientY: box.top + v * box.height, bubbles: true }));
    tapAt(0.1, 0.1);
    tapAt(0.6, 0.9);
    await wait(50);
    const height = view().getBoundingClientRect().height;
    const picture = cropping.shadowRoot.querySelector("hui-image");
    const zoom = picture.style.transform;
    check("C-3 crop key", keyNamed(cropping, "crop").getAttribute("aria-pressed") === "true", "the Crop key stays on once the crop is set");
    check("C-3 not stretched", /^translate\([-\d.]+%, [-\d.]+%\) scale\([\d.]+\)$/.test(zoom) && picture.fitMode === "cover",
      `the crop only zooms the picture, the same both ways, as the xTool card's fills its box (${zoom}, ${picture.fitMode})`);
    for (let i = 0; i < 3; i++) {
      cropping.hass = makeHass();
      await wait(30);
    }
    check("C-3 steady", picture.style.transform === zoom && cropping.shadowRoot.querySelector("hui-image") === picture && view().getBoundingClientRect().height === height,
      `the same picture, zoom and box through updates (${picture.style.transform}, ${view().getBoundingClientRect().height}px)`);
    keyNamed(cropping, "crop").click();
    await wait(50);
    check("C-4 crop off", picture.style.transform === "" && view().getBoundingClientRect().height === height,
      `Crop off: the whole picture, in the same box (${view().getBoundingClientRect().height}px)`);

    // A heater's field: the higher number on top, Off under the reading, the arrow beside both
    const pairs = [...temps.shadowRoot.querySelectorAll("prusa-field.pair")];
    const order = pairs.map((p) => {
      const reading = parseFloat(p.querySelector(".now").textContent), target = Number(p.querySelector("input").value || 0);
      const above = p.querySelector(".two").classList.contains("above");
      return { key: p.dataset.key, ok: above === (target > 0 && target - reading > 3), above };
    });
    check("H-6 order", pairs.length >= 2 && order.every((o) => o.ok), `the reading on top, the target only when well above it (${order.map((o) => `${o.key}: ${o.above ? "target" : "reading"} on top`).join(", ")})`);
    check("H-6 arrow", pairs.every((p) => [...p.querySelectorAll(".arrow")].every((arrow) => arrow.parentElement.classList.contains("icon"))),
      "the arrow on the heater's icon");
    const arrows = pairs.flatMap((p) => [...p.querySelectorAll(".arrow")].map((arrow) => [p, getComputedStyle(arrow).color]));
    check("H-6 arrow", arrows.every(([p, color]) => color === (p.classList.contains("heating") ? "rgb(244, 67, 54)" : "rgb(33, 150, 243)")),
      `red while heating, blue while cooling (${arrows.map(([p, c]) => `${p.dataset.key}: ${c}`).join(", ") || "no heater heating or cooling"})`);

    // A heater's colors: the history's (Prusa Connect's palette by default; the target dimmed)
    const nozzlePair = keyNamed(temps, "tool_1_nozzle_temperature_and_target");
    check("H-7 colors", nozzlePair.style.getPropertyValue("--prusa-reading") === "#fd5000" && nozzlePair.style.getPropertyValue("--prusa-target") === "#873109",
      `the nozzle in the history's colors (${nozzlePair.style.getPropertyValue("--prusa-reading")}, ${nozzlePair.style.getPropertyValue("--prusa-target")})`);
    const deep = (root, selector) => {
      const found = root.querySelector(selector);
      if (found) return found;
      for (const el of root.querySelectorAll("*")) {
        const hit = el.shadowRoot && deep(el.shadowRoot, selector);
        if (hit) return hit;
      }
      return null;
    };
    const colored = addCard("Colors from the history", {
      features: [{ type: "custom:prusa-temperatures" }, { type: "custom:prusa-history", colors: { tool_1_nozzle_temperature: "green" } }],
    }, { height: 520 });
    await wait(300);
    const coloredPair = deep(colored.shadowRoot, '[data-key="tool_1_nozzle_temperature_and_target"]');
    const coloredGraph = window.cardHelperCalls.filter((c) => c.type === "history-graph").pop();
    check("H-7 colors", coloredPair?.style.getPropertyValue("--prusa-reading") === "#4caf50" && coloredGraph?.entities[0].color === "#4caf50",
      `a color given in the history is the field's too (${coloredPair?.style.getPropertyValue("--prusa-reading")}, ${coloredGraph?.entities[0].color})`);

    // The history's editor: Home Assistant's own fields; Hours to show takes any number, and can be left empty
    const historyForm = customElements.get("prusa-history").editor(hass, "sensor.office_core_one_state");
    const fields = historyForm.schema.flatMap((s) => s.schema && s.type === "grid" ? s.schema : [s]);
    const hours = fields.find((f) => f.name === "hours_to_show");
    check("G-4 editor", hours?.selector.number.min === 0 && hours.selector.number.step === "any" && historyForm.data({}).hours_to_show === undefined,
      `Hours to show: any number from 0, empty when not set (${JSON.stringify(hours?.selector)})`);
    check("G-4 editor", ["expand_legend", "min_y_axis", "max_y_axis", "fit_y_data"].every((n) => fields.some((f) => f.name === n)) && !fields.some((f) => f.name === "logarithmic_scale"),
      "the history graph card's own options, without Logarithmic scale");
    const colorsField = historyForm.schema.find((s) => s.name === "colors");
    check("G-5 colors", colorsField?.type === "expandable" && colorsField.schema.every((f) => f.selector.ui_color) && colorsField.schema.map((f) => f.name).includes("bed_temperature"),
      `a color for each heater (${colorsField?.schema.map((f) => f.name)})`);

    // The numbers alone, the reading never cut short
    const narrow = addFeature({ type: "custom:prusa-temperatures", controls: ["tool_1_nozzle_temperature_and_target"] }, {});
    narrow.parentElement.style.width = "80px";
    await wait(100);
    const slim = keyNamed(narrow, "tool_1_nozzle_temperature_and_target");
    const slimNow = slim.querySelector(".now");
    check("H-8 numbers alone", !/°/.test(slim.textContent) && !slim.querySelector(".unit"), `no units (${textOf(slim)})`);
    check("H-8 never cut short", slimNow.scrollWidth <= slimNow.clientWidth + 0.5 && getComputedStyle(slimNow).textOverflow !== "ellipsis",
      `the reading whole in a narrow field (${slimNow.textContent}, ${slimNow.scrollWidth} / ${slimNow.clientWidth}px)`);


    // At its target: the reading alone, larger; a tap brings the target back to type in
    const settled = addFeature({ type: "custom:prusa-temperatures", controls: ["tool_1_nozzle_temperature_and_target"] }, {});
    settled.parentElement.style.width = "160px";
    await wait(100);
    const level = keyNamed(settled, "tool_1_nozzle_temperature_and_target");
    const levelTarget = level.querySelector(".target");
    const bigger = parseFloat(getComputedStyle(level.querySelector(".now")).fontSize) > parseFloat(getComputedStyle(level).fontSize);
    check("H-9 at target", getComputedStyle(levelTarget).display === "none" && bigger,
      `the target left out, the reading larger (${getComputedStyle(levelTarget).display}, ${getComputedStyle(level.querySelector(".now")).fontSize})`);
    level.click();
    await wait(100);
    const typing = level.querySelector("input");
    check("H-9 at target", getComputedStyle(level.querySelector(".target")).display !== "none" && settled.shadowRoot.activeElement === typing,
      "a tap shows the target, ready to type");
    typing.blur();
    await wait(100);
    check("H-9 at target", getComputedStyle(level.querySelector(".target")).display === "none", "and leaves it out again after");

    // Side by side: a feature that wraps takes as many lines as the one beside it
    const sides = addCard("Heaters beside Presets and Cool down", {
      features: [
        { type: "custom:prusa-print", controls: ["pause_resume", "stop"] },
        { type: "custom:prusa-temperatures", controls: ["tool_1_nozzle_temperature_and_target", "bed_temperature_and_target"] },
        { type: "custom:prusa-temperatures", controls: ["presets", "cool_down"] },
        { type: "custom:prusa-history", full_width: true },
      ],
      last_feature_full_width: false,
    }, { width: 340, height: 700 });
    await wait(400);
    const sideFeatures = [...deep(sides.shadowRoot, 'hui-card-features[slot="features"]').shadowRoot.querySelectorAll("hui-card-feature")];
    const [heaters, keys] = sideFeatures.map((f) => f.getBoundingClientRect());
    check("L-6 side by side", heaters && keys && Math.abs(heaters.top - keys.top) < 1 && Math.abs(heaters.left - keys.left) > 1 && Math.abs(heaters.height - keys.height) < 1 && heaters.height > 60,
      `the two the same height (${sideFeatures.map((f) => { const r = f.getBoundingClientRect(); return `${f.feature?.type} ${r.left.toFixed(0)},${r.top.toFixed(0)} ${r.width.toFixed(0)}x${r.height.toFixed(0)}`; }).join("; ")})`);

    // The same for every feature: a row of keys wraps to match, a single key grows to fill
    for (const [name, other] of [["two keys", { type: "custom:prusa-print", controls: ["pause_resume", "stop"] }], ["one key", { type: "custom:prusa-nozzles", controls: ["material"] }]]) {
      const pairCard = addCard(`Heaters beside ${name}`, {
        features: [
          { type: "custom:prusa-print", controls: ["pause_resume", "stop"] },
          { type: "custom:prusa-temperatures", controls: ["tool_1_nozzle_temperature_and_target", "bed_temperature_and_target"] },
          other,
          { type: "custom:prusa-history", full_width: true },
        ],
        last_feature_full_width: false,
      }, { width: 340, height: 700 });
      await wait(400);
      const [left, right] = [...deep(pairCard.shadowRoot, 'hui-card-features[slot="features"]').shadowRoot.querySelectorAll("hui-card-feature")].map((f) => f.getBoundingClientRect());
      const inner = deep(pairCard.shadowRoot, 'hui-card-features[slot="features"]').shadowRoot.querySelectorAll("hui-card-feature")[1].shadowRoot.firstElementChild.shadowRoot;
      const keys = [...inner.querySelectorAll(".key, .field")].map((k) => k.getBoundingClientRect());
      const bottom = Math.max(...keys.map((k) => k.bottom));
      check("L-6 side by side", left && right && Math.abs(left.height - right.height) < 1 && Math.abs(bottom - right.bottom) < 2,
        `${name}: as tall as the heaters, filled to the bottom (${left?.height.toFixed(0)}, ${right?.height.toFixed(0)}, ${(right?.bottom - bottom).toFixed(0)}px empty)`);
    }

    // Badges: the xTool card's size
    const card = addCard("XL, paused", { entity: "sensor.garage_xl_state" });
    await wait(150);
    const badge = card.shadowRoot.querySelector(".badge.status.on");
    check("B-2 badge size", !!badge && getComputedStyle(badge).width === "18px" && getComputedStyle(badge.querySelector("ha-state-icon")).getPropertyValue("--mdc-icon-size").trim() === "12px",
      `an 18 px circle, a 12 px icon (${badge && getComputedStyle(badge).width})`);
  });
</script>
