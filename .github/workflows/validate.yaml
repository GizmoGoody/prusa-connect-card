# The Marketplace's own checks of the repository (hacs/action), so it is
# ready for the catalog. Kept apart from CI, so an alpha still publishes
# while something the catalog needs (such as screenshots) is missing.
name: Marketplace validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
