# Checks every push and pull request: typecheck, unit tests, the build, and
# the browser tests against the built card. The alpha workflow runs it too,
# before it publishes (pushes to card run it there, not here).
name: CI

on:
  push:
    branches-ignore: [card]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The versions in the lockfile, exactly
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Browser tests
        run: python3 tests/browser/run.py
